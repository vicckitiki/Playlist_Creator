<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador Indie Rock Massivo - Spotify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 2px solid #22c55e; color: white; }
        .tab-inactive { color: #a1a1aa; }
    </style>
</head>
<body class="bg-zinc-900 text-white min-h-screen font-sans">

    <!-- Tela de Login -->
    <div id="login-section" class="flex flex-col items-center justify-center min-h-screen p-4 space-y-6">
        <h1 class="text-4xl font-bold text-center">Gerador de Playlist Massiva</h1>
        <p class="text-zinc-400 text-center max-w-md">Crie ou incremente playlists gigantescas no seu Spotify usando extração profunda de discografias.</p>
        <button onclick="loginComPKCE()" class="bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-8 rounded-full transition shadow-lg">
            Conectar com o Spotify
        </button>
    </div>

    <!-- Tela Principal da Aplicação -->
    <div id="app-section" class="hidden max-w-4xl mx-auto p-6 pt-12">
        
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold">Painel de Geração</h2>
            <div class="flex items-center space-x-4">
                <span id="user-name" class="text-zinc-300 font-medium text-sm">Carregando perfil...</span>
                <button onclick="logout()" class="text-sm text-zinc-400 hover:text-white border border-zinc-600 px-4 py-2 rounded-full transition">Sair</button>
            </div>
        </div>

        <div class="flex mb-6 border-b border-zinc-700">
            <button id="tab-new" onclick="switchTab('new')" class="pb-2 px-4 tab-active font-semibold">Criar Nova Playlist</button>
            <button id="tab-inc" onclick="switchTab('inc')" class="pb-2 px-4 tab-inactive font-semibold hover:text-white transition">Incrementar Existente</button>
        </div>

        <div id="form-container" class="bg-zinc-800 p-6 rounded-xl shadow-lg space-y-5">
            
            <div id="new-playlist-fields">
                <label class="block text-sm text-zinc-400 mb-1">Nome da Nova Playlist</label>
                <input type="text" id="playlist-name" class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Ex: Indie Rock Gigante">
            </div>

            <div id="inc-playlist-fields" class="hidden">
                <label class="block text-sm text-zinc-400 mb-1">Selecione sua Playlist</label>
                <select id="playlist-select" class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">Carregando suas playlists...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-zinc-400 mb-1">Gênero, Tema ou Artista (Semente)</label>
                <input type="text" id="genre-seed" class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500" value="indie rock">
            </div>

            <div>
                <label class="block text-sm text-zinc-400 mb-1">Quantidade de Músicas a Buscar</label>
                <input type="number" id="track-limit" class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500" value="300" max="10000">
            </div>

            <button onclick="gerarPreview()" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-full mt-2 transition text-lg">
                Varrer Músicas e Gerar Preview
            </button>
        </div>

        <!-- Tela de Preview -->
        <div id="preview-section" class="hidden bg-zinc-800 p-6 rounded-xl shadow-lg mt-6">
            <h3 class="text-xl font-bold mb-2">Preview da Geração</h3>
            <p id="preview-stats" class="text-zinc-400 mb-4">Analisando faixas...</p>
            
            <div class="h-64 overflow-y-auto bg-zinc-900 rounded p-4 mb-4 border border-zinc-700" id="preview-list"></div>

            <div class="flex space-x-4">
                <button onclick="confirmarEInjetar()" class="flex-1 bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-full transition">
                    Confirmar e Salvar no Spotify
                </button>
                <button onclick="cancelarPreview()" class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 px-6 rounded-full transition">
                    Cancelar
                </button>
            </div>
        </div>

        <div id="status-msg" class="mt-4 text-center text-sm font-semibold hidden"></div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const CLIENT_ID = '5682ad86f0e645c183a9fdd721d6768d';
        const REDIRECT_URI = 'https://vicckitiki.github.io/Playlist_Creator/';
        
        let accessToken = localStorage.getItem('access_token');
        let userId = '';
        let currentMode = 'new';
        let tracksToInject = []; 

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // --- PKCE LOGIN ---
        function generateRandomString(length) {
            const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            const values = crypto.getRandomValues(new Uint8Array(length));
            return values.reduce((acc, x) => acc + possible[x % possible.length], "");
        }

        async function generateCodeChallenge(codeVerifier) {
            const data = new TextEncoder().encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)]))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/, '');
        }

        async function loginComPKCE() {
            const codeVerifier = generateRandomString(64);
            window.localStorage.setItem('code_verifier', codeVerifier);
            const codeChallenge = await generateCodeChallenge(codeVerifier);

            const params = new URLSearchParams({
                client_id: CLIENT_ID,
                response_type: 'code',
                redirect_uri: REDIRECT_URI,
                scope: 'playlist-modify-public playlist-modify-private playlist-read-private user-read-private',
                code_challenge_method: 'S256',
                code_challenge: codeChallenge,
                show_dialog: 'true'
            });

            window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
        }

        async function fetchToken(code) {
            const codeVerifier = localStorage.getItem('code_verifier');
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: CLIENT_ID,
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    code_verifier: codeVerifier
                })
            });

            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('access_token', data.access_token);
                accessToken = data.access_token;
                window.history.replaceState({}, document.title, window.location.pathname);
                iniciarApp();
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.reload();
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) fetchToken(code);
            else if (accessToken) iniciarApp();
        };

        // --- SISTEMA DE API E LOGS ---
        async function apiCall(endpoint, method = 'GET', body = null) {
            const url = `https://api.spotify.com/v1${endpoint}`;
            
            const options = {
                method: method,
                headers: { 
                    'Authorization': `Bearer ${accessToken}`, 
                    'Content-Type': 'application/json' 
                }
            };
            if (body) options.body = JSON.stringify(body);
            
            try {
                const response = await fetch(url, options);
                
                if (response.status === 401) { 
                    logout(); 
                    return null; 
                }
                if (response.status === 429) {
                    console.warn("Spotify Rate Limit atingido! Esperando 3 segundos...");
                    await sleep(3000);
                    return apiCall(endpoint, method, body); // Tenta novamente
                }
                
                const data = await response.json().catch(() => null);
                return data; 
                
            } catch (error) {
                console.error("FALHA NA REQUISIÇÃO:", error);
                return null;
            }
        }

        async function iniciarApp() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-section').classList.remove('hidden');
            
            const userData = await apiCall('/me');
            if (userData) {
                userId = userData.id;
                document.getElementById('user-name').innerText = `Olá, ${userData.display_name || userData.id}`;
            }
            carregarPlaylists();
        }

        function switchTab(tab) {
            currentMode = tab;
            const btnNew = document.getElementById('tab-new');
            const btnInc = document.getElementById('tab-inc');
            const fieldsNew = document.getElementById('new-playlist-fields');
            const fieldsInc = document.getElementById('inc-playlist-fields');

            if (tab === 'new') {
                btnNew.className = "pb-2 px-4 tab-active font-semibold";
                btnInc.className = "pb-2 px-4 tab-inactive font-semibold hover:text-white transition";
                fieldsNew.classList.remove('hidden');
                fieldsInc.classList.add('hidden');
            } else {
                btnInc.className = "pb-2 px-4 tab-active font-semibold";
                btnNew.className = "pb-2 px-4 tab-inactive font-semibold hover:text-white transition";
                fieldsInc.classList.remove('hidden');
                fieldsNew.classList.add('hidden');
            }
        }

        async function carregarPlaylists() {
            const data = await apiCall('/me/playlists?limit=50');
            const select = document.getElementById('playlist-select');
            select.innerHTML = '';
            if (data && data.items) {
                data.items.forEach(pl => {
                    if(pl && pl.owner && pl.owner.id === userId) {
                        const totalTracks = pl.tracks ? pl.tracks.total : 0;
                        const option = document.createElement('option');
                        option.value = pl.id;
                        option.text = `${pl.name} (${totalTracks} músicas)`;
                        select.appendChild(option);
                    }
                });
            }
        }

        function setStatus(msg, isError = false) {
            const el = document.getElementById('status-msg');
            el.classList.remove('hidden', 'text-red-500', 'text-green-500', 'text-zinc-400');
            el.classList.add(isError ? 'text-red-500' : 'text-zinc-400');
            el.innerText = msg;
        }

        // --- LÓGICA DE VARREDURA PROFUNDA (BASEADA NO PYTHON) ---
        async function gerarPreview() {
            const metaTotal = parseInt(document.getElementById('track-limit').value) || 300;
            const queryRaw = document.getElementById('genre-seed').value.trim();
            const queryEncoded = encodeURIComponent(queryRaw);
            
            let existingUris = new Set();
            console.log(`--- INICIANDO GERAÇÃO --- Meta: ${metaTotal} músicas.`);

            if (currentMode === 'inc') {
                const playlistId = document.getElementById('playlist-select').value;
                if (!playlistId) return setStatus("Selecione uma playlist!", true);
                
                setStatus("Lendo músicas da sua playlist para evitar duplicatas...");
                let url = `/playlists/${playlistId}/tracks?fields=next,items(track(uri))&limit=100`;
                while (url) {
                    const res = await apiCall(url.replace('https://api.spotify.com/v1', ''));
                    if (res && res.items) {
                        res.items.forEach(item => { if(item && item.track) existingUris.add(item.track.uri) });
                        url = res.next;
                    } else {
                        url = null;
                    }
                }
            }

            // ETAPA 1: MAPEAR ARTISTAS (limit=10 e offset step 10)
            setStatus(`Mapeando artistas relacionados a '${queryRaw}'...`);
            let artistIds = new Set();
            
            for(let offset = 0; offset < 200; offset += 10) {
                const searchRes = await apiCall(`/search?q=${queryEncoded}&type=track&limit=10&offset=${offset}`);
                if (!searchRes || !searchRes.tracks || searchRes.tracks.items.length === 0) break;

                searchRes.tracks.items.forEach(track => {
                    if (track.artists) track.artists.forEach(a => artistIds.add(a.id));
                });
                await sleep(200); // Pausa para segurança da API
            }

            if (artistIds.size === 0) {
                return setStatus("Nenhum artista encontrado. Tente um termo mais comum.", true);
            }

            // ETAPA 2: EXTRAIR DISCOGRAFIAS DOS ARTISTAS
            setStatus(`Mapeados ${artistIds.size} artistas! Extraindo discografias (limit=10)...`);
            let foundTracks = [];
            let artistCounts = {};
            
            for (let a_id of artistIds) {
                if (foundTracks.length >= metaTotal) break;

                const albumsRes = await apiCall(`/artists/${a_id}/albums?include_groups=album,single&limit=10`);
                if (!albumsRes || !albumsRes.items) continue;

                for (let album of albumsRes.items) {
                    if (foundTracks.length >= metaTotal) break;

                    const tracksRes = await apiCall(`/albums/${album.id}/tracks?limit=10`);
                    if (!tracksRes || !tracksRes.items) continue;

                    for (let track of tracksRes.items) {
                        if (foundTracks.length >= metaTotal) break;

                        if (!existingUris.has(track.uri)) {
                            // Endpoint de faixas de álbum não traz imagens; copiamos do próprio álbum
                            track.album = { images: album.images };
                            if (!track.artists || track.artists.length === 0) track.artists = [{name: "Desconhecido"}];

                            foundTracks.push(track);
                            existingUris.add(track.uri);
                            
                            let artistName = track.artists[0].name;
                            artistCounts[artistName] = (artistCounts[artistName] || 0) + 1;
                        }
                    }
                    await sleep(200); // Pausa para segurança da API
                }
            }

            if (foundTracks.length === 0) {
                return setStatus("Erro: Nenhuma música nova recolhida.", true);
            }

            tracksToInject = foundTracks.map(t => t.uri);
            renderPreview(foundTracks, artistCounts);
        }

        function renderPreview(tracks, artistCounts) {
            document.getElementById('form-container').classList.add('hidden');
            document.getElementById('preview-section').classList.remove('hidden');
            setStatus("");

            document.getElementById('preview-stats').innerText = `${tracks.length} novas faixas extraídas da discografia.`;

            const listEl = document.getElementById('preview-list');
            listEl.innerHTML = '';

            const artistsHtml = Object.entries(artistCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10)
                .map(entry => `<span class="bg-zinc-800 px-2 py-1 rounded text-xs border border-zinc-600">${entry[0]}: ${entry[1]}</span>`)
                .join(' ');

            listEl.innerHTML += `<div class="mb-4"><p class="text-sm text-zinc-400 mb-2">Principais Artistas Minerados:</p><div class="flex flex-wrap gap-2">${artistsHtml}</div></div><hr class="border-zinc-700 mb-4">`;

            tracks.slice(0, 20).forEach(track => {
                let previewAudio = track.preview_url ? `<audio controls src="${track.preview_url}" class="h-8 w-full mt-1"></audio>` : `<span class="text-xs text-red-400">Sem preview de áudio</span>`;
                let imageUrl = (track.album && track.album.images && track.album.images.length > 0) ? track.album.images[0].url : '';
                
                listEl.innerHTML += `
                    <div class="mb-3 flex items-center gap-3">
                        ${imageUrl ? `<img src="${imageUrl}" class="w-10 h-10 rounded">` : '<div class="w-10 h-10 bg-zinc-700 rounded"></div>'}
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold truncate">${track.name}</p>
                            <p class="text-xs text-zinc-400 truncate">${track.artists[0].name}</p>
                            ${previewAudio}
                        </div>
                    </div>
                `;
            });
            if(tracks.length > 20) listEl.innerHTML += `<p class="text-center text-sm text-zinc-500 mt-4">... e mais ${tracks.length - 20} faixas ocultas no preview.</p>`;
        }

        function cancelarPreview() {
            document.getElementById('preview-section').classList.add('hidden');
            document.getElementById('form-container').classList.remove('hidden');
            tracksToInject = [];
        }

        // --- INJEÇÃO NO SPOTIFY ---
        async function confirmarEInjetar() {
            if (tracksToInject.length === 0) return alert("Nenhuma faixa para injetar!");
            
            let playlistId = '';
            
            if (currentMode === 'new') {
                setStatus("Criando a nova playlist no seu perfil...");
                const plName = document.getElementById('playlist-name').value || 'Gerador Indie Rock';
                const resPl = await apiCall(`/users/${userId}/playlists`, 'POST', {
                    name: plName,
                    description: "Criada via Script - Extração Profunda de Discografias.",
                    public: false
                });
                if(!resPl) return setStatus("Falha na criação da playlist. Verifique o Console.", true);
                playlistId = resPl.id;
            } else {
                playlistId = document.getElementById('playlist-select').value;
            }

            setStatus("Injetando as faixas no Spotify em lotes de 100 músicas...");
            
            const chunkSize = 100;
            for (let i = 0; i < tracksToInject.length; i += chunkSize) {
                const chunk = tracksToInject.slice(i, i + chunkSize);
                await apiCall(`/playlists/${playlistId}/tracks`, 'POST', { uris: chunk });
                setStatus(`Injetando: ${Math.min(i + chunkSize, tracksToInject.length)} / ${tracksToInject.length} músicas...`);
                await sleep(500); // Pausa recomendada entre inserts
            }

            document.getElementById('status-msg').classList.replace('text-zinc-400', 'text-green-500');
            setStatus("Sucesso absoluto! A playlist gigante está pronta na sua conta.");
            setTimeout(() => { window.location.reload(); }, 4000);
        }
    </script>
</body>
</html>
