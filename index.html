<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Playlist Massiva - Spotify</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .tab-active { border-bottom: 2px solid #22c55e; color: #fff; }
  .tab-inactive { color: #a1a1aa; border-bottom: 2px solid transparent; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body class="bg-zinc-900 text-white min-h-screen font-sans">

<!-- LOGIN -->
<section id="login-section" class="hidden flex-col items-center justify-center min-h-screen p-4 space-y-6">
  <h1 class="text-4xl font-bold text-center">Gerador de Playlist Massiva</h1>
  <p class="text-zinc-400 text-center max-w-md">
    Crie ou aumente playlists grandes no Spotify a partir de um gênero ou artista.
  </p>
  <button id="btn-login" class="bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-8 rounded-full transition">
    Conectar com o Spotify
  </button>
</section>

<!-- APP -->
<main id="app-section" class="hidden max-w-3xl mx-auto p-6 pt-12">
  <div class="flex justify-between items-center mb-8">
    <h2 class="text-3xl font-bold">Painel de geração</h2>
    <div class="flex items-center gap-4">
      <span id="user-name" class="text-zinc-300 text-sm"></span>
      <button id="btn-logout" class="text-sm text-zinc-400 hover:text-white border border-zinc-600 px-4 py-2 rounded-full transition">Sair</button>
    </div>
  </div>

  <div id="form-container">
    <div class="flex mb-6 border-b border-zinc-700">
      <button id="tab-new" class="pb-2 px-4 font-semibold tab-active">Criar nova playlist</button>
      <button id="tab-inc" class="pb-2 px-4 font-semibold tab-inactive hover:text-white transition">Adicionar a uma existente</button>
    </div>

    <div class="bg-zinc-800 p-6 rounded-xl space-y-5">
      <div id="new-fields">
        <label for="playlist-name" class="block text-sm text-zinc-400 mb-1">Nome da nova playlist</label>
        <input id="playlist-name" type="text" maxlength="100" placeholder="Ex: Indie rock gigante"
               class="w-full bg-zinc-700 rounded p-3 focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <div id="inc-fields" class="hidden">
        <label for="playlist-select" class="block text-sm text-zinc-400 mb-1">Sua playlist</label>
        <select id="playlist-select" class="w-full bg-zinc-700 rounded p-3 focus:outline-none focus:ring-2 focus:ring-green-500"></select>
      </div>

      <div>
        <label for="genre-seed" class="block text-sm text-zinc-400 mb-1">Gênero ou artista</label>
        <input id="genre-seed" type="text" value="indie rock"
               class="w-full bg-zinc-700 rounded p-3 focus:outline-none focus:ring-2 focus:ring-green-500">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="track-limit" class="block text-sm text-zinc-400 mb-1">Quantidade de músicas</label>
          <input id="track-limit" type="number" value="300" min="1" max="2000"
                 class="w-full bg-zinc-700 rounded p-3 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
        <div>
          <label for="artist-cap" class="block text-sm text-zinc-400 mb-1">Máximo por artista</label>
          <input id="artist-cap" type="number" value="10" min="1" max="50"
                 class="w-full bg-zinc-700 rounded p-3 focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>
      </div>

      <button id="btn-preview" class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-full transition text-lg">
        Buscar músicas e gerar preview
      </button>
    </div>
  </div>

  <!-- PREVIEW -->
  <div id="preview-section" class="hidden bg-zinc-800 p-6 rounded-xl">
    <h3 class="text-xl font-bold mb-2">Preview</h3>
    <p id="preview-stats" class="text-zinc-400 mb-4"></p>
    <div id="preview-list" class="h-72 overflow-y-auto bg-zinc-900 rounded p-4 mb-4 border border-zinc-700"></div>
    <div class="flex gap-4">
      <button id="btn-confirm" class="flex-1 bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-full transition">
        Salvar no Spotify
      </button>
      <button id="btn-cancel" class="bg-zinc-700 hover:bg-zinc-600 font-bold py-3 px-6 rounded-full transition">
        Cancelar
      </button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="result-section" class="hidden bg-zinc-800 p-6 rounded-xl text-center space-y-4">
    <p class="text-lg font-semibold text-green-400">Playlist salva com sucesso.</p>
    <div class="flex justify-center gap-4">
      <a id="result-link" href="#" target="_blank" rel="noopener noreferrer"
         class="bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-6 rounded-full transition">Abrir no Spotify</a>
      <button id="btn-again" class="bg-zinc-700 hover:bg-zinc-600 font-bold py-3 px-6 rounded-full transition">Gerar outra</button>
    </div>
  </div>
</main>

<div id="status-msg" class="hidden max-w-3xl mx-auto px-6 pb-12 text-center text-sm font-semibold whitespace-pre-line"></div>

<script>
/* ============================================================
 * CONFIGURAÇÃO
 * ============================================================ */
const CLIENT_ID = '5682ad86f0e645c183a9fdd721d6768d';
const REDIRECT_URI = 'https://vicckitiki.github.io/Playlist_Creator/'; // precisa ser IDÊNTICA à cadastrada no Dashboard
const SCOPES = 'playlist-modify-public playlist-modify-private playlist-read-private';
const API_BASE = 'https://api.spotify.com/v1';
const TOKEN_URL = 'https://accounts.spotify.com/api/token';

const MAX_SEARCH_REQUESTS = 600; // trava de segurança
let searchLimit = 10;            // cai para 5 automaticamente se o Spotify recusar

/* ============================================================
 * ESTADO
 * ============================================================ */
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} },
  clear: () => { try { localStorage.clear(); } catch {} }
};

let accessToken = store.get('access_token');
let refreshToken = store.get('refresh_token');
let expiresAt = Number(store.get('expires_at') || 0);

let userId = '';
let mode = 'new';
let busy = false;
let pending = null; // { uris, mode, playlistId, name, added }
let refreshPromise = null;

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, min, max, fallback) => {
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? Math.min(Math.max(n, min), max) : fallback;
};

class ApiError extends Error {
  constructor(status, message, url) {
    super(message);
    this.status = status;
    this.url = url;
  }
}

/* ============================================================
 * UTILITÁRIOS DE INTERFACE
 * ============================================================ */
function setStatus(msg, type = 'info') {
  const el = $('status-msg');
  if (!msg) { el.classList.add('hidden'); el.textContent = ''; return; }
  el.className = 'max-w-3xl mx-auto px-6 pb-12 text-center text-sm font-semibold whitespace-pre-line ' +
    (type === 'error' ? 'text-red-400' : type === 'success' ? 'text-green-400' : 'text-zinc-400');
  el.textContent = msg;
}

function setBusy(value) {
  busy = value;
  document.querySelectorAll('button').forEach(b => { b.disabled = value; });
}

function escapeHtml(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
}

function describeError(e) {
  console.error('Erro:', e, e?.url || '');
  if (e instanceof ApiError) {
    if (e.status === 403) {
      return `Spotify recusou o acesso (403): ${e.message}\n` +
        'Confira no Developer Dashboard: seu e-mail em "User Management", conta com Premium, ' +
        'e saia e conecte de novo para renovar as permissões.';
    }
    if (e.status === 400) return `Requisição inválida (400): ${e.message}`;
    return `Erro do Spotify (${e.status}): ${e.message}`;
  }
  return e?.message || 'Erro desconhecido.';
}

/* ============================================================
 * OAUTH 2.0 + PKCE
 * ============================================================ */
function randomString(length) {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
  const values = crypto.getRandomValues(new Uint32Array(length));
  return Array.from(values, v => chars[v % chars.length]).join('');
}

async function codeChallenge(verifier) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(digest)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function login() {
  try {
    const verifier = randomString(64);
    const state = randomString(32);
    store.set('code_verifier', verifier);
    store.set('oauth_state', state);

    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      code_challenge_method: 'S256',
      code_challenge: await codeChallenge(verifier),
      state
    });
    window.location.href = `https://accounts.spotify.com/authorize?${params}`;
  } catch (e) {
    setStatus(describeError(e), 'error');
  }
}

function saveTokens(data) {
  accessToken = data.access_token;
  expiresAt = Date.now() + Number(data.expires_in || 3600) * 1000;
  store.set('access_token', accessToken);
  store.set('expires_at', String(expiresAt));
  if (data.refresh_token) {
    refreshToken = data.refresh_token;
    store.set('refresh_token', refreshToken);
  }
}

async function requestToken(params) {
  const res = await fetch(TOKEN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(params)
  });
  const data = await res.json().catch(() => null);
  if (!res.ok || !data?.access_token) {
    throw new ApiError(res.status, data?.error_description || data?.error || 'Falha ao obter token.', TOKEN_URL);
  }
  return data;
}

async function exchangeCode(code) {
  const verifier = store.get('code_verifier');
  if (!verifier) throw new Error('Sessão de login perdida. Clique em conectar novamente.');
  const data = await requestToken({
    client_id: CLIENT_ID,
    grant_type: 'authorization_code',
    code,
    redirect_uri: REDIRECT_URI,
    code_verifier: verifier
  });
  saveTokens(data);
  store.del('code_verifier');
  store.del('oauth_state');
}

// Evita duas renovações simultâneas
function refreshAccessToken() {
  if (!refreshToken) return Promise.resolve(false);
  if (!refreshPromise) {
    refreshPromise = requestToken({
      grant_type: 'refresh_token',
      refresh_token: refreshToken,
      client_id: CLIENT_ID
    })
      .then(data => { saveTokens(data); return true; })
      .catch(() => false)
      .finally(() => { refreshPromise = null; });
  }
  return refreshPromise;
}

function logout() {
  store.clear();
  accessToken = refreshToken = null;
  expiresAt = 0;
  window.location.href = window.location.pathname;
}

function showLogin() {
  $('app-section').classList.add('hidden');
  const el = $('login-section');
  el.classList.remove('hidden');
  el.classList.add('flex');
}

/* ============================================================
 * CHAMADAS À API (sempre lançam ApiError em caso de falha)
 * ============================================================ */
function toUrl(endpoint) {
  if (endpoint.startsWith('https://')) return endpoint;
  return API_BASE + (endpoint.startsWith('/') ? '' : '/') + endpoint;
}

async function apiCall(endpoint, { method = 'GET', body = null } = {}) {
  const url = toUrl(endpoint);
  let refreshed = false;
  let serverRetries = 0;

  for (let attempt = 0; attempt < 8; attempt++) {
    if (refreshToken && expiresAt && Date.now() > expiresAt - 60000) {
      await refreshAccessToken();
    }

    let res;
    try {
      res = await fetch(url, {
        method,
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          ...(body ? { 'Content-Type': 'application/json' } : {})
        },
        body: body ? JSON.stringify(body) : undefined
      });
    } catch (e) {
      throw new ApiError(0, `Sem conexão com o Spotify (${e.message}).`, url);
    }

    if (res.status === 401 && !refreshed) {
      refreshed = true;
      if (await refreshAccessToken()) continue;
    }

    if (res.status === 429) {
      const wait = Math.min(Number(res.headers.get('Retry-After')) || 5, 60);
      setStatus(`Limite de requisições do Spotify. Aguardando ${wait}s...`);
      await sleep(wait * 1000);
      continue;
    }

    if (res.status >= 500 && serverRetries < 2) {
      serverRetries++;
      await sleep(1000 * serverRetries);
      continue;
    }

    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = null; }

    if (!res.ok) {
      const msg = data?.error?.message || data?.error_description || (typeof data?.error === 'string' ? data.error : '') || res.statusText || 'erro desconhecido';
      throw new ApiError(res.status, msg, url);
    }
    return data;
  }
  throw new ApiError(429, 'Muitas tentativas. Tente novamente em alguns minutos.', url);
}

/* ============================================================
 * INICIALIZAÇÃO
 * ============================================================ */
async function init() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const returnedState = params.get('state');
  const oauthError = params.get('error');
  const hadCallback = code || oauthError;
  if (hadCallback) window.history.replaceState({}, document.title, window.location.pathname);

  if (oauthError) {
    showLogin();
    return setStatus(`Autorização não concluída: ${oauthError}`, 'error');
  }

  if (code) {
    try {
      const storedState = store.get('oauth_state');
      if (!storedState || storedState !== returnedState) throw new Error('Falha de segurança na autenticação. Conecte novamente.');
      await exchangeCode(code);
    } catch (e) {
      showLogin();
      return setStatus(describeError(e), 'error');
    }
  }

  if (!accessToken) return showLogin();
  await startApp();
}

async function startApp() {
  $('login-section').classList.add('hidden');
  $('login-section').classList.remove('flex');
  $('app-section').classList.remove('hidden');
  setStatus('Validando sessão...');

  try {
    const me = await apiCall('/me');
    userId = me.id;
    $('user-name').textContent = `Olá, ${me.display_name || me.id}`;
  } catch (e) {
    if (e.status === 401) {
      store.clear();
      accessToken = refreshToken = null;
      showLogin();
      return setStatus('Sessão expirada. Conecte novamente.', 'error');
    }
    return setStatus(describeError(e), 'error');
  }

  try {
    await loadPlaylists();
    setStatus('');
  } catch (e) {
    setStatus(`Não foi possível listar suas playlists.\n${describeError(e)}`, 'error');
  }
}

function switchTab(tab) {
  mode = tab;
  const isNew = tab === 'new';
  $('tab-new').className = 'pb-2 px-4 font-semibold ' + (isNew ? 'tab-active' : 'tab-inactive hover:text-white transition');
  $('tab-inc').className = 'pb-2 px-4 font-semibold ' + (isNew ? 'tab-inactive hover:text-white transition' : 'tab-active');
  $('new-fields').classList.toggle('hidden', !isNew);
  $('inc-fields').classList.toggle('hidden', isNew);
}

/* ============================================================
 * PLAYLISTS
 * ============================================================ */
async function loadPlaylists() {
  const select = $('playlist-select');
  select.innerHTML = '';
  const all = [];
  let url = '/me/playlists?limit=50';

  while (url) {
    const data = await apiCall(url);
    all.push(...(data?.items || []));
    url = data?.next || null;
  }

  const mine = all.filter(p => p && p.owner?.id === userId);
  if (!mine.length) {
    select.add(new Option('Nenhuma playlist própria encontrada', ''));
    return;
  }
  for (const p of mine) {
    const total = p.items?.total ?? p.tracks?.total ?? 0;
    select.add(new Option(`${p.name} (${total} músicas)`, p.id));
  }
}

async function loadPlaylistUris(playlistId) {
  const uris = new Set();
  let url = `/playlists/${encodeURIComponent(playlistId)}/items?limit=50`;
  while (url) {
    const data = await apiCall(url);
    for (const entry of data?.items || []) {
      const item = entry?.item || entry?.track;
      if (item?.uri) uris.add(item.uri);
    }
    url = data?.next || null;
  }
  return uris;
}

/* ============================================================
 * BUSCA DE MÚSICAS
 * Usa só /search (poucas chamadas) e varia a consulta por faixas de
 * ano para passar do limite de 1000 resultados por busca.
 * ============================================================ */
function buildQueries(seed) {
  const s = seed.replace(/"/g, '');
  const now = new Date().getFullYear();
  const bands = [[2020, now], [2015, 2019], [2010, 2014], [2005, 2009], [2000, 2004],
                 [1990, 1999], [1980, 1989], [1970, 1979], [1960, 1969]];
  const queries = [`genre:"${s}"`, s];
  for (const [a, b] of bands) queries.push(`genre:"${s}" year:${a}-${b}`);
  for (const [a, b] of bands) queries.push(`${s} year:${a}-${b}`);
  return queries;
}

async function searchTracks(seed, goal, cap, existing) {
  const tracks = [];
  const seen = new Set(existing);
  const perArtist = {};
  let requests = 0;
  let lastError = null;

  for (const q of buildQueries(seed)) {
    let offset = 0;

    while (offset + searchLimit <= 1000 && tracks.length < goal && requests < MAX_SEARCH_REQUESTS) {
      let data;
      try {
        requests++;
        data = await apiCall(`/search?q=${encodeURIComponent(q)}&type=track&limit=${searchLimit}&offset=${offset}`);
      } catch (e) {
        if (e.status === 401 || e.status === 403) throw e;
        if (e.status === 400 && searchLimit > 5) { searchLimit = 5; continue; } // tenta de novo com limite menor
        lastError = e;
        break;
      }

      const items = (data?.tracks?.items || []).filter(t => t && t.uri && !t.is_local);
      if (!(data?.tracks?.items || []).length) break;

      for (const t of items) {
        if (tracks.length >= goal) break;
        if (seen.has(t.uri)) continue;
        const artist = t.artists?.[0];
        const key = artist?.id || artist?.name || 'desconhecido';
        if ((perArtist[key] || 0) >= cap) continue;

        seen.add(t.uri);
        perArtist[key] = (perArtist[key] || 0) + 1;
        tracks.push({
          uri: t.uri,
          name: t.name || 'Sem nome',
          artist: artist?.name || 'Desconhecido',
          image: t.album?.images?.[t.album.images.length - 1]?.url || ''
        });
      }

      offset += searchLimit;
      setStatus(`Buscando... ${tracks.length} / ${goal} músicas encontradas`);
      await sleep(120);
    }

    if (tracks.length >= goal || requests >= MAX_SEARCH_REQUESTS) break;
  }
  return { tracks, lastError };
}

/* ============================================================
 * PREVIEW
 * ============================================================ */
async function generatePreview() {
  if (busy) return;

  const seed = $('genre-seed').value.trim();
  const goal = clamp($('track-limit').value, 1, 2000, 300);
  const cap = clamp($('artist-cap').value, 1, 50, 10);
  if (!seed) return setStatus('Informe um gênero ou artista.', 'error');

  let playlistId = '';
  if (mode === 'inc') {
    playlistId = $('playlist-select').value;
    if (!playlistId) return setStatus('Selecione uma playlist.', 'error');
  }

  setBusy(true);
  try {
    let existing = new Set();
    if (mode === 'inc') {
      setStatus('Lendo a playlist para evitar duplicatas...');
      existing = await loadPlaylistUris(playlistId);
    }

    setStatus('Buscando músicas...');
    const { tracks, lastError } = await searchTracks(seed, goal, cap, existing);

    if (!tracks.length) {
      throw new Error(lastError
        ? `Nenhuma música retornada.\n${describeError(lastError)}`
        : 'Nenhuma música nova encontrada. Tente outro termo.');
    }

    pending = {
      uris: tracks.map(t => t.uri),
      mode,
      playlistId,
      name: $('playlist-name').value.trim() || `Playlist ${seed}`,
      added: 0
    };
    renderPreview(tracks, goal);
  } catch (e) {
    setStatus(describeError(e), 'error');
  } finally {
    setBusy(false);
  }
}

function renderPreview(tracks, goal) {
  $('form-container').classList.add('hidden');
  $('preview-section').classList.remove('hidden');
  setStatus('');

  const note = tracks.length < goal ? ` (você pediu ${goal}; o Spotify não retornou mais)` : '';
  $('preview-stats').textContent = `${tracks.length} faixas prontas para salvar${note}.`;

  const counts = {};
  tracks.forEach(t => { counts[t.artist] = (counts[t.artist] || 0) + 1; });
  const chips = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10)
    .map(([name, n]) => `<span class="bg-zinc-800 px-2 py-1 rounded text-xs border border-zinc-600">${escapeHtml(name)}: ${n}</span>`)
    .join(' ');

  const rows = tracks.slice(0, 30).map(t => `
    <div class="mb-3 flex items-center gap-3">
      ${t.image ? `<img src="${escapeHtml(t.image)}" alt="" class="w-10 h-10 rounded">` : '<div class="w-10 h-10 bg-zinc-700 rounded"></div>'}
      <div class="flex-1 min-w-0">
        <p class="text-sm font-bold truncate">${escapeHtml(t.name)}</p>
        <p class="text-xs text-zinc-400 truncate">${escapeHtml(t.artist)}</p>
      </div>
    </div>`).join('');

  const more = tracks.length > 30
    ? `<p class="text-center text-sm text-zinc-500 mt-4">... e mais ${tracks.length - 30} faixas não exibidas.</p>` : '';

  $('preview-list').innerHTML =
    `<div class="mb-4"><p class="text-sm text-zinc-400 mb-2">Artistas mais frequentes:</p><div class="flex flex-wrap gap-2">${chips}</div></div>
     <hr class="border-zinc-700 mb-4">${rows}${more}`;
}

function cancelPreview() {
  if (busy) return;
  pending = null;
  $('preview-section').classList.add('hidden');
  $('form-container').classList.remove('hidden');
  setStatus('');
}

/* ============================================================
 * SALVAR NO SPOTIFY
 * ============================================================ */
async function confirmAndSave() {
  if (busy || !pending) return;
  setBusy(true);

  try {
    if (pending.mode === 'new' && !pending.playlistId) {
      setStatus('Criando a playlist...');
      const pl = await apiCall('/me/playlists', {
        method: 'POST',
        body: { name: pending.name, description: 'Criada via Gerador de Playlist Massiva.', public: false }
      });
      if (!pl?.id) throw new Error('O Spotify não retornou o ID da playlist criada.');
      pending.playlistId = pl.id; // se falhar adiante, o retry reaproveita esta playlist
    }

    const chunkSize = 100;
    while (pending.added < pending.uris.length) {
      const chunk = pending.uris.slice(pending.added, pending.added + chunkSize);
      await apiCall(`/playlists/${encodeURIComponent(pending.playlistId)}/items`, {
        method: 'POST',
        body: { uris: chunk }
      });
      pending.added += chunk.length;
      setStatus(`Salvando: ${pending.added} / ${pending.uris.length} músicas...`);
      await sleep(300);
    }

    const id = pending.playlistId;
    const total = pending.uris.length;
    pending = null;

    $('preview-section').classList.add('hidden');
    $('result-section').classList.remove('hidden');
    $('result-link').href = `https://open.spotify.com/playlist/${encodeURIComponent(id)}`;
    setStatus(`${total} músicas adicionadas.`, 'success');

    loadPlaylists().catch(() => {}); // atualiza a lista, sem travar se falhar
  } catch (e) {
    const partial = pending?.added ? `\n${pending.added} músicas já foram salvas. Clique em salvar para continuar de onde parou.` : '';
    setStatus(describeError(e) + partial, 'error');
  } finally {
    setBusy(false);
  }
}

function startOver() {
  $('result-section').classList.add('hidden');
  $('form-container').classList.remove('hidden');
  setStatus('');
}

/* ============================================================
 * EVENTOS
 * ============================================================ */
$('btn-login').addEventListener('click', login);
$('btn-logout').addEventListener('click', logout);
$('tab-new').addEventListener('click', () => switchTab('new'));
$('tab-inc').addEventListener('click', () => switchTab('inc'));
$('btn-preview').addEventListener('click', generatePreview);
$('btn-confirm').addEventListener('click', confirmAndSave);
$('btn-cancel').addEventListener('click', cancelPreview);
$('btn-again').addEventListener('click', startOver);

init();
</script>
</body>
