<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Playlist Massivo - Spotify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 2px solid #22c55e; color: white; }
        .tab-inactive { color: #a1a1aa; }
    </style>
</head>

<body class="bg-zinc-900 text-white min-h-screen font-sans">

    <!-- LOGIN -->
    <div id="login-section"
         class="flex flex-col items-center justify-center min-h-screen p-4 space-y-6">
        <h1 class="text-4xl font-bold text-center">Gerador de Playlist Massiva</h1>
        <p class="text-zinc-400 text-center max-w-md">
            Crie ou incremente playlists grandes no seu Spotify usando extração de discografias.
        </p>

        <button onclick="loginComPKCE()"
                class="bg-green-500 hover:bg-green-400 text-black font-bold py-3 px-8 rounded-full transition shadow-lg">
            Conectar com o Spotify
        </button>
    </div>

    <!-- APP -->
    <div id="app-section" class="hidden max-w-4xl mx-auto p-6 pt-12">

        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold">Painel de Geração</h2>

            <div class="flex items-center space-x-4">
                <span id="user-name" class="text-zinc-300 font-medium text-sm">
                    Carregando perfil...
                </span>

                <button onclick="logout()"
                        class="text-sm text-zinc-400 hover:text-white border border-zinc-600 px-4 py-2 rounded-full transition">
                    Sair
                </button>
            </div>
        </div>

        <div class="flex mb-6 border-b border-zinc-700">
            <button id="tab-new"
                    onclick="switchTab('new')"
                    class="pb-2 px-4 tab-active font-semibold">
                Criar Nova Playlist
            </button>

            <button id="tab-inc"
                    onclick="switchTab('inc')"
                    class="pb-2 px-4 tab-inactive font-semibold hover:text-white transition">
                Incrementar Existente
            </button>
        </div>

        <div id="form-container"
             class="bg-zinc-800 p-6 rounded-xl shadow-lg space-y-5">

            <div id="new-playlist-fields">
                <label class="block text-sm text-zinc-400 mb-1">
                    Nome da Nova Playlist
                </label>

                <input type="text"
                       id="playlist-name"
                       class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500"
                       placeholder="Ex: Indie Rock Gigante">
            </div>

            <div id="inc-playlist-fields" class="hidden">
                <label class="block text-sm text-zinc-400 mb-1">
                    Selecione sua Playlist
                </label>

                <select id="playlist-select"
                        class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500">
                    <option value="">Carregando suas playlists...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-zinc-400 mb-1">
                    Gênero, Tema ou Artista (Semente)
                </label>

                <input type="text"
                       id="genre-seed"
                       class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500"
                       value="indie rock">
            </div>

            <div>
                <label class="block text-sm text-zinc-400 mb-1">
                    Quantidade de Músicas a Buscar
                </label>

                <input type="number"
                       id="track-limit"
                       class="w-full bg-zinc-700 rounded p-3 text-white focus:outline-none focus:ring-2 focus:ring-green-500"
                       value="300"
                       min="1"
                       max="10000">
            </div>

            <button onclick="gerarPreview()"
                    class="w-full bg-green-500 hover:bg-green-400 text-black font-bold py-4 rounded-full mt-2 transition text-lg">
                Varrer Músicas e Gerar Preview
            </button>
        </div>

        <!-- PREVIEW -->
        <div id="preview-section"
             class="hidden bg-zinc-800 p-6 rounded-xl shadow-lg mt-6">

            <h3 class="text-xl font-bold mb-2">Preview da Geração</h3>

            <p id="preview-stats" class="text-zinc-400 mb-4">
                Analisando faixas...
            </p>

            <div class="h-64 overflow-y-auto bg-zinc-900 rounded p-4 mb-4 border border-zinc-700"
                 id="preview-list"></div>

            <div class="flex space-x-4">
                <button onclick="confirmarEInjetar()"
                        class="flex-1 bg-green-500 hover:bg-green-400 text-black font-bold py-3 rounded-full transition">
                    Confirmar e Salvar no Spotify
                </button>

                <button onclick="cancelarPreview()"
                        class="bg-zinc-700 hover:bg-zinc-600 text-white font-bold py-3 px-6 rounded-full transition">
                    Cancelar
                </button>
            </div>
        </div>

        <div id="status-msg"
             class="mt-4 text-center text-sm font-semibold hidden"></div>
    </div>

<script>
/*
 * ============================================================
 * CONFIGURAÇÃO
 * ============================================================
 */

const CLIENT_ID = '5682ad86f0e645c183a9fdd721d6768d';
const REDIRECT_URI = 'https://vicckitiki.github.io/Playlist_Creator/';

const SCOPES = [
    'playlist-modify-public',
    'playlist-modify-private',
    'playlist-read-private',
    'user-read-private'
].join(' ');

const API_BASE = 'https://api.spotify.com/v1';

let accessToken = localStorage.getItem('access_token');
let refreshTokenValue = localStorage.getItem('refresh_token');
let expiresAt = Number(localStorage.getItem('expires_at') || 0);

let userId = '';
let currentMode = 'new';
let tracksToInject = [];

const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));


/*
 * ============================================================
 * UTILITÁRIOS
 * ============================================================
 */

function setStatus(msg, isError = false) {
    const el = document.getElementById('status-msg');

    if (!msg) {
        el.classList.add('hidden');
        el.innerText = '';
        return;
    }

    el.classList.remove(
        'hidden',
        'text-red-500',
        'text-green-500',
        'text-zinc-400'
    );

    el.classList.add(isError ? 'text-red-500' : 'text-zinc-400');
    el.innerText = msg;
}

function getApiUrl(endpoint) {
    if (!endpoint) return API_BASE;

    if (endpoint.startsWith('https://api.spotify.com/')) {
        return endpoint;
    }

    if (endpoint.startsWith('/v1/')) {
        return `https://api.spotify.com${endpoint}`;
    }

    if (endpoint.startsWith('/')) {
        return `${API_BASE}${endpoint}`;
    }

    return `${API_BASE}/${endpoint}`;
}

function generateRandomString(length = 64) {
    const chars =
        'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

    const values = new Uint32Array(length);
    crypto.getRandomValues(values);

    return Array.from(values, value => chars[value % chars.length]).join('');
}

async function generateCodeChallenge(codeVerifier) {
    const data = new TextEncoder().encode(codeVerifier);
    const digest = await crypto.subtle.digest('SHA-256', data);

    return btoa(
        String.fromCharCode(...new Uint8Array(digest))
    )
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
}


/*
 * ============================================================
 * OAUTH 2.0 + PKCE
 * ============================================================
 */

async function loginComPKCE() {
    const codeVerifier = generateRandomString(64);
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    const state = generateRandomString(32);

    localStorage.setItem('code_verifier', codeVerifier);
    localStorage.setItem('oauth_state', state);

    const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: codeChallenge,
        state: state,
        show_dialog: 'true'
    });

    window.location.href =
        `https://accounts.spotify.com/authorize?${params.toString()}`;
}

async function fetchToken(code) {
    const codeVerifier = localStorage.getItem('code_verifier');

    if (!codeVerifier) {
        throw new Error(
            'Code verifier não encontrado. Faça login novamente.'
        );
    }

    const response = await fetch(
        'https://accounts.spotify.com/api/token',
        {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
                client_id: CLIENT_ID,
                grant_type: 'authorization_code',
                code: code,
                redirect_uri: REDIRECT_URI,
                code_verifier: codeVerifier
            })
        }
    );

    const data = await response.json().catch(() => null);

    if (!response.ok || !data?.access_token) {
        console.error('Falha ao obter token:', response.status, data);

        throw new Error(
            data?.error_description ||
            data?.error ||
            'Não foi possível obter o token do Spotify.'
        );
    }

    saveTokenData(data);

    localStorage.removeItem('code_verifier');
    localStorage.removeItem('oauth_state');

    return data;
}

function saveTokenData(data) {
    accessToken = data.access_token;

    if (data.refresh_token) {
        refreshTokenValue = data.refresh_token;
        localStorage.setItem('refresh_token', refreshTokenValue);
    }

    const expiresIn = Number(data.expires_in || 3600);

    expiresAt = Date.now() + (expiresIn * 1000);

    localStorage.setItem('access_token', accessToken);
    localStorage.setItem('expires_at', String(expiresAt));
}

async function refreshAccessToken() {
    if (!refreshTokenValue) {
        return false;
    }

    const response = await fetch(
        'https://accounts.spotify.com/api/token',
        {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshTokenValue,
                client_id: CLIENT_ID
            })
        }
    );

    const data = await response.json().catch(() => null);

    console.log('Refresh token:', response.status, data);

    if (!response.ok || !data?.access_token) {
        /*
         * Se o refresh token expirou/revogou, não adianta
         * continuar tentando. É necessário autenticar novamente.
         */
        if (data?.error === 'invalid_grant') {
            logout();
            return false;
        }

        return false;
    }

    saveTokenData(data);
    return true;
}


/*
 * ============================================================
 * CHAMADAS À API SPOTIFY
 * ============================================================
 */

async function apiCall(
    endpoint,
    method = 'GET',
    body = null,
    retryAfterRefresh = true
) {
    /*
     * Se o token estiver próximo de expirar, tenta renová-lo
     * antes de fazer a requisição.
     */
    if (
        accessToken &&
        refreshTokenValue &&
        expiresAt &&
        Date.now() >= expiresAt - 60000
    ) {
        await refreshAccessToken();
    }

    const url = getApiUrl(endpoint);

    const options = {
        method,
        headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
        }
    };

    if (body !== null && body !== undefined) {
        options.body = JSON.stringify(body);
    }

    try {
        const response = await fetch(url, options);

        const data = await response.json().catch(() => null);

        console.log('Spotify API:', {
            method,
            url,
            status: response.status,
            response: data
        });

        /*
         * TOKEN EXPIRADO
         */
        if (response.status === 401 && retryAfterRefresh) {
            const refreshed = await refreshAccessToken();

            if (refreshed) {
                return apiCall(
                    endpoint,
                    method,
                    body,
                    false
                );
            }

            logout();
            return null;
        }

        /*
         * PERMISSÃO NEGADA
         */
        if (response.status === 403) {
            const message =
                data?.error?.message ||
                data?.message ||
                'Operação não autorizada pelo Spotify.';

            console.error('SPOTIFY 403:', {
                endpoint,
                method,
                message,
                response: data
            });

            setStatus(
                `Spotify recusou a operação (403): ${message}`,
                true
            );

            return null;
        }

        /*
         * RATE LIMIT
         */
        if (response.status === 429) {
            const retryAfter =
                Number(response.headers.get('Retry-After')) || 5;

            console.warn(
                `Rate limit do Spotify. Aguardando ${retryAfter}s...`
            );

            setStatus(
                `Spotify limitou temporariamente as requisições. Aguardando ${retryAfter}s...`
            );

            await sleep(retryAfter * 1000);

            return apiCall(
                endpoint,
                method,
                body,
                retryAfterRefresh
            );
        }

        /*
         * OUTROS ERROS HTTP
         */
        if (!response.ok) {
            console.error('Erro Spotify:', {
                status: response.status,
                endpoint,
                data
            });

            setStatus(
                `Erro Spotify (${response.status}): ${
                    data?.error?.message ||
                    data?.message ||
                    'erro desconhecido'
                }`,
                true
            );

            return null;
        }

        return data;

    } catch (error) {
        console.error('FALHA NA REQUISIÇÃO:', error);

        setStatus(
            `Falha de comunicação com o Spotify: ${error.message}`,
            true
        );

        return null;
    }
}


/*
 * ============================================================
 * LOGIN / LOGOUT / INICIALIZAÇÃO
 * ============================================================
 */

function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token');
    localStorage.removeItem('expires_at');
    localStorage.removeItem('code_verifier');
    localStorage.removeItem('oauth_state');

    accessToken = null;
    refreshTokenValue = null;
    expiresAt = 0;

    window.location.reload();
}

async function inicializarOAuth() {
    const urlParams = new URLSearchParams(window.location.search);

    const code = urlParams.get('code');
    const returnedState = urlParams.get('state');
    const oauthError = urlParams.get('error');

    /*
     * Spotify informou que o usuário recusou ou ocorreu
     * algum problema durante o OAuth.
     */
    if (oauthError) {
        console.error('OAuth error:', oauthError);

        window.history.replaceState(
            {},
            document.title,
            window.location.pathname
        );

        setStatus(
            `Autorização não concluída: ${oauthError}`,
            true
        );

        return;
    }

    /*
     * Temos um código de autorização.
     */
    if (code) {
        const storedState = localStorage.getItem('oauth_state');

        if (!storedState || storedState !== returnedState) {
            console.error('Falha na validação do state OAuth.');

            localStorage.removeItem('oauth_state');
            localStorage.removeItem('code_verifier');

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

            alert(
                'Falha de segurança na autenticação. Faça login novamente.'
            );

            return;
        }

        try {
            await fetchToken(code);

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );

            await iniciarApp();

        } catch (error) {
            console.error('Erro no login:', error);

            alert(error.message);

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }

        return;
    }

    /*
     * Já temos um token salvo.
     */
    if (accessToken) {
        await iniciarApp();
        return;
    }

    /*
     * Sem autenticação.
     */
    document.getElementById('login-section').classList.remove('hidden');
    document.getElementById('app-section').classList.add('hidden');
}

async function iniciarApp() {
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('app-section').classList.remove('hidden');

    setStatus('Validando sua sessão com o Spotify...');

    const userData = await apiCall('/me');

    if (!userData) {
        return;
    }

    userId = userData.id;

    document.getElementById('user-name').innerText =
        `Olá, ${userData.display_name || userData.id}`;

    await carregarPlaylists();

    setStatus('');
}


/*
 * ============================================================
 * ABAS
 * ============================================================
 */

function switchTab(tab) {
    currentMode = tab;

    const btnNew = document.getElementById('tab-new');
    const btnInc = document.getElementById('tab-inc');

    const fieldsNew =
        document.getElementById('new-playlist-fields');

    const fieldsInc =
        document.getElementById('inc-playlist-fields');

    if (tab === 'new') {
        btnNew.className =
            'pb-2 px-4 tab-active font-semibold';

        btnInc.className =
            'pb-2 px-4 tab-inactive font-semibold hover:text-white transition';

        fieldsNew.classList.remove('hidden');
        fieldsInc.classList.add('hidden');

    } else {
        btnInc.className =
            'pb-2 px-4 tab-active font-semibold';

        btnNew.className =
            'pb-2 px-4 tab-inactive font-semibold hover:text-white transition';

        fieldsInc.classList.remove('hidden');
        fieldsNew.classList.add('hidden');
    }
}


/*
 * ============================================================
 * PLAYLISTS DO USUÁRIO
 * ============================================================
 */

async function carregarPlaylists() {
    const select = document.getElementById('playlist-select');

    select.innerHTML =
        '<option value="">Carregando suas playlists...</option>';

    /*
     * O endpoint atual é /me/playlists.
     */
    let url = '/me/playlists?limit=50';

    const playlists = [];

    while (url) {
        const data = await apiCall(url);

        if (!data || !Array.isArray(data.items)) {
            break;
        }

        playlists.push(...data.items);

        url = data.next;
    }

    select.innerHTML = '';

    const minhasPlaylists = playlists.filter(
        playlist =>
            playlist &&
            playlist.owner &&
            playlist.owner.id === userId
    );

    if (minhasPlaylists.length === 0) {
        const option = document.createElement('option');

        option.value = '';
        option.text =
            'Nenhuma playlist própria encontrada';

        select.appendChild(option);
        return;
    }

    minhasPlaylists.forEach(playlist => {
        const option = document.createElement('option');

        option.value = playlist.id;

        /*
         * A API atual usa "items" em vez de "tracks".
         * O total pode não vir dependendo do endpoint/fields.
         */
        const totalItems =
            playlist.items?.total ??
            playlist.tracks?.total ??
            0;

        option.text =
            `${playlist.name} (${totalItems} músicas)`;

        select.appendChild(option);
    });
}


/*
 * ============================================================
 * LEITURA DE ITENS DE UMA PLAYLIST
 * ============================================================
 */

async function carregarUrisDaPlaylist(playlistId) {
    const existingUris = new Set();

    /*
     * Endpoint atual:
     * GET /playlists/{id}/items
     *
     * "tracks" foi substituído por "items".
     */
    let url =
        `/playlists/${playlistId}/items` +
        `?fields=next,items(item(uri,type)),total` +
        `&limit=50`;

    while (url) {
        const data = await apiCall(url);

        if (!data || !Array.isArray(data.items)) {
            break;
        }

        for (const entry of data.items) {
            /*
             * API atual: entry.item
             *
             * Mantemos entry.track como fallback para
             * compatibilidade com respostas antigas.
             */
            const item = entry?.item || entry?.track;

            if (
                item &&
                item.type === 'track' &&
                item.uri
            ) {
                existingUris.add(item.uri);
            }
        }

        url = data.next;
    }

    return existingUris;
}


/*
 * ============================================================
 * GERAÇÃO DO PREVIEW
 * ============================================================
 */

async function gerarPreview() {
    const metaTotal =
        Math.max(
            1,
            Math.min(
                parseInt(
                    document.getElementById('track-limit').value
                ) || 300,
                10000
            )
        );

    const queryRaw =
        document.getElementById('genre-seed')
            .value
            .trim();

    if (!queryRaw) {
        setStatus(
            'Informe um gênero, artista ou termo de busca.',
            true
        );

        return;
    }

    const queryEncoded =
        encodeURIComponent(queryRaw);

    let existingUris = new Set();

    console.log(
        `--- INICIANDO GERAÇÃO --- Meta: ${metaTotal} músicas.`
    );

    /*
     * Se estamos incrementando uma playlist existente,
     * carregamos os itens para evitar duplicatas.
     */
    if (currentMode === 'inc') {
        const playlistId =
            document.getElementById('playlist-select').value;

        if (!playlistId) {
            setStatus(
                'Selecione uma playlist!',
                true
            );

            return;
        }

        setStatus(
            'Lendo músicas da sua playlist para evitar duplicatas...'
        );

        existingUris =
            await carregarUrisDaPlaylist(playlistId);

        console.log(
            `Playlist possui ${existingUris.size} faixas rastreadas.`
        );
    }

    /*
     * ========================================================
     * ETAPA 1: MAPEAR ARTISTAS
     *
     * Em 2026, Search tem limite máximo de 10 por request.
     * Portanto paginamos usando offset.
     * ========================================================
     */

    setStatus(
        `Pesquisando artistas relacionados a "${queryRaw}"...`
    );

    const artistIds = new Set();

    /*
     * Spotify Search atualmente permite no máximo 10 itens
     * por requisição.
     *
     * Fazemos várias páginas.
     */
    const maxSearchPages = 20;

    for (
        let page = 0;
        page < maxSearchPages;
        page++
    ) {
        const offset = page * 10;

        const searchRes =
            await apiCall(
                `/search?q=${queryEncoded}` +
                `&type=track&limit=10&offset=${offset}`
            );

        if (
            !searchRes ||
            !searchRes.tracks ||
            !Array.isArray(searchRes.tracks.items) ||
            searchRes.tracks.items.length === 0
        ) {
            break;
        }

        for (const track of searchRes.tracks.items) {
            if (Array.isArray(track.artists)) {
                for (const artist of track.artists) {
                    if (artist?.id) {
                        artistIds.add(artist.id);
                    }
                }
            }
        }

        /*
         * Pequena pausa para não disparar centenas de
         * requisições instantaneamente.
         */
        await sleep(150);
    }

    if (artistIds.size === 0) {
        setStatus(
            'Nenhum artista encontrado. Tente um termo mais comum.',
            true
        );

        return;
    }

    console.log(
        `Artistas encontrados: ${artistIds.size}`
    );

    /*
     * ========================================================
     * ETAPA 2: EXTRAIR DISCOGRAFIAS
     * ========================================================
     */

    setStatus(
        `Mapeados ${artistIds.size} artistas! Extraindo discografias...`
    );

    const foundTracks = [];
    const foundUris = new Set();
    const artistCounts = {};

    /*
     * Como o objetivo é montar uma playlist, não precisamos
     * consultar mais artistas depois que atingimos a meta.
     */
    for (const artistId of artistIds) {
        if (foundTracks.length >= metaTotal) {
            break;
        }

        /*
         * GET /artists/{id}/albums
         *
         * Limit máximo deste endpoint é maior que o Search,
         * portanto usamos 50.
         */
        let albumUrl =
            `/artists/${artistId}/albums` +
            `?include_groups=album,single` +
            `&limit=50`;

        const artistAlbums = [];

        while (
            albumUrl &&
            foundTracks.length < metaTotal
        ) {
            const albumsRes =
                await apiCall(albumUrl);

            if (
                !albumsRes ||
                !Array.isArray(albumsRes.items)
            ) {
                break;
            }

            artistAlbums.push(
                ...albumsRes.items
            );

            albumUrl = albumsRes.next;
        }

        /*
         * Evita processar o mesmo álbum duas vezes caso
         * ele apareça em grupos diferentes.
         */
        const processedAlbums = new Set();

        for (const album of artistAlbums) {
            if (foundTracks.length >= metaTotal) {
                break;
            }

            if (!album?.id || processedAlbums.has(album.id)) {
                continue;
            }

            processedAlbums.add(album.id);

            /*
             * GET /albums/{id}/tracks
             *
             * O máximo é 50.
             */
            let tracksUrl =
                `/albums/${album.id}/tracks?limit=50`;

            while (
                tracksUrl &&
                foundTracks.length < metaTotal
            ) {
                const tracksRes =
                    await apiCall(tracksUrl);

                if (
                    !tracksRes ||
                    !Array.isArray(tracksRes.items)
                ) {
                    break;
                }

                for (const track of tracksRes.items) {
                    if (foundTracks.length >= metaTotal) {
                        break;
                    }

                    if (!track?.uri) {
                        continue;
                    }

                    /*
                     * Evita duplicatas tanto contra a
                     * playlist quanto dentro da coleta atual.
                     */
                    if (
                        existingUris.has(track.uri) ||
                        foundUris.has(track.uri)
                    ) {
                        continue;
                    }

                    /*
                     * O endpoint de album tracks retorna uma
                     * faixa simplificada e não traz imagens.
                     * Pegamos a capa do álbum.
                     */
                    track.album = {
                        id: album.id,
                        name: album.name,
                        images: album.images || []
                    };

                    if (
                        !Array.isArray(track.artists) ||
                        track.artists.length === 0
                    ) {
                        track.artists = [
                            { name: 'Desconhecido' }
                        ];
                    }

                    foundTracks.push(track);
                    foundUris.add(track.uri);

                    const artistName =
                        track.artists[0]?.name ||
                        'Desconhecido';

                    artistCounts[artistName] =
                        (artistCounts[artistName] || 0) + 1;
                }

                tracksUrl = tracksRes.next;

                await sleep(100);
            }
        }
    }

    if (foundTracks.length === 0) {
        setStatus(
            'Nenhuma música nova foi encontrada.',
            true
        );

        return;
    }

    tracksToInject =
        foundTracks.map(track => track.uri);

    console.log(
        `Faixas encontradas: ${tracksToInject.length}`
    );

    renderPreview(
        foundTracks,
        artistCounts
    );
}


/*
 * ============================================================
 * PREVIEW
 * ============================================================
 */

function renderPreview(tracks, artistCounts) {
    document
        .getElementById('form-container')
        .classList.add('hidden');

    document
        .getElementById('preview-section')
        .classList.remove('hidden');

    setStatus('');

    document
        .getElementById('preview-stats')
        .innerText =
        `${tracks.length} novas faixas extraídas da discografia.`;

    const listEl =
        document.getElementById('preview-list');

    listEl.innerHTML = '';

    const artistsHtml =
        Object.entries(artistCounts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 10)
            .map(
                entry =>
                    `<span class="bg-zinc-800 px-2 py-1 rounded text-xs border border-zinc-600">${escapeHtml(entry[0])}: ${entry[1]}</span>`
            )
            .join(' ');

    listEl.innerHTML +=
        `<div class="mb-4">
            <p class="text-sm text-zinc-400 mb-2">
                Principais Artistas Minerados:
            </p>
            <div class="flex flex-wrap gap-2">
                ${artistsHtml}
            </div>
        </div>
        <hr class="border-zinc-700 mb-4">`;

    tracks.slice(0, 20).forEach(track => {
        const previewAudio =
            track.preview_url
                ? `<audio controls src="${escapeHtml(track.preview_url)}" class="h-8 w-full mt-1"></audio>`
                : `<span class="text-xs text-red-400">Sem preview de áudio</span>`;

        const imageUrl =
            track.album?.images?.length > 0
                ? track.album.images[0].url
                : '';

        const artistName =
            track.artists?.[0]?.name ||
            'Desconhecido';

        listEl.innerHTML +=
            `<div class="mb-3 flex items-center gap-3">
                ${
                    imageUrl
                        ? `<img src="${escapeHtml(imageUrl)}" class="w-10 h-10 rounded">`
                        : `<div class="w-10 h-10 bg-zinc-700 rounded"></div>`
                }

                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold truncate">
                        ${escapeHtml(track.name || 'Sem nome')}
                    </p>

                    <p class="text-xs text-zinc-400 truncate">
                        ${escapeHtml(artistName)}
                    </p>

                    ${previewAudio}
                </div>
            </div>`;
    });

    if (tracks.length > 20) {
        listEl.innerHTML +=
            `<p class="text-center text-sm text-zinc-500 mt-4">
                ... e mais ${tracks.length - 20} faixas ocultas no preview.
            </p>`;
    }
}

function escapeHtml(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function cancelarPreview() {
    document
        .getElementById('preview-section')
        .classList.add('hidden');

    document
        .getElementById('form-container')
        .classList.remove('hidden');

    tracksToInject = [];

    setStatus('');
}


/*
 * ============================================================
 * CRIAÇÃO / INJEÇÃO NA PLAYLIST
 * ============================================================
 */

async function confirmarEInjetar() {
    if (tracksToInject.length === 0) {
        alert('Nenhuma faixa para injetar!');
        return;
    }

    /*
     * Desabilita o botão para impedir duplo clique.
     */
    const buttons =
        document.querySelectorAll(
            '#preview-section button'
        );

    buttons.forEach(button => {
        button.disabled = true;
        button.classList.add(
            'opacity-50',
            'cursor-not-allowed'
        );
    });

    try {
        let playlistId = '';

        /*
         * ====================================================
         * CRIAR NOVA PLAYLIST
         *
         * IMPORTANTE:
         * Endpoint atual = POST /me/playlists
         *
         * O antigo POST /users/{user_id}/playlists foi removido.
         * ====================================================
         */

        if (currentMode === 'new') {
            setStatus(
                'Criando a nova playlist no seu perfil...'
            );

            const plName =
                document.getElementById('playlist-name')
                    .value
                    .trim() ||
                'Gerador Indie Rock';

            const resPl =
                await apiCall(
                    '/me/playlists',
                    'POST',
                    {
                        name: plName,
                        description:
                            'Criada via Gerador de Playlist Massiva.',
                        public: false
                    }
                );

            if (!resPl?.id) {
                throw new Error(
                    'O Spotify não retornou o ID da nova playlist.'
                );
            }

            playlistId = resPl.id;

            console.log(
                'Playlist criada:',
                resPl
            );

        } else {
            playlistId =
                document.getElementById(
                    'playlist-select'
                ).value;

            if (!playlistId) {
                throw new Error(
                    'Nenhuma playlist foi selecionada.'
                );
            }
        }

        /*
         * ====================================================
         * ADICIONAR FAIXAS
         *
         * Endpoint atual:
         * POST /playlists/{playlist_id}/items
         *
         * O endpoint antigo /tracks foi removido.
         * ====================================================
         */

        setStatus(
            `Injetando ${tracksToInject.length} músicas...`
        );

        const chunkSize = 100;

        for (
            let i = 0;
            i < tracksToInject.length;
            i += chunkSize
        ) {
            const chunk =
                tracksToInject.slice(
                    i,
                    i + chunkSize
                );

            const result =
                await apiCall(
                    `/playlists/${playlistId}/items`,
                    'POST',
                    {
                        uris: chunk
                    }
                );

            /*
             * apiCall retorna null em erro.
             * Não podemos simplesmente continuar, pois
             * isso deixaria uma playlist parcialmente preenchida
             * sem informar corretamente o usuário.
             */
            if (!result) {
                throw new Error(
                    `Falha ao adicionar o lote ${Math.floor(i / chunkSize) + 1}.`
                );
            }

            const processed =
                Math.min(
                    i + chunk.length,
                    tracksToInject.length
                );

            setStatus(
                `Injetando: ${processed} / ${tracksToInject.length} músicas...`
            );

            /*
             * Pequena pausa entre lotes.
             */
            if (
                processed <
                tracksToInject.length
            ) {
                await sleep(300);
            }
        }

        /*
         * SUCESSO
         */
        document
            .getElementById('status-msg')
            .classList.remove('text-zinc-400');

        document
            .getElementById('status-msg')
            .classList.add('text-green-500');

        setStatus(
            'Sucesso! A playlist foi criada/atualizada no Spotify.'
        );

        /*
         * Link direto para a playlist quando disponível.
         */
        if (playlistId) {
            const openSpotify =
                confirm(
                    'Playlist concluída com sucesso! Deseja abrir no Spotify?'
                );

            if (openSpotify) {
                window.open(
                    `https://open.spotify.com/playlist/${playlistId}`,
                    '_blank',
                    'noopener,noreferrer'
                );
            }
        }

        setTimeout(() => {
            window.location.reload();
        }, 1500);

    } catch (error) {
        console.error(
            'Erro na criação/injeção:',
            error
        );

        setStatus(
            `Operação interrompida: ${error.message}`,
            true
        );

        buttons.forEach(button => {
            button.disabled = false;
            button.classList.remove(
                'opacity-50',
                'cursor-not-allowed'
            );
        });
    }
}
